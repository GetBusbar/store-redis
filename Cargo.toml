# SPDX-License-Identifier: Apache-2.0
[package]
name = "busbar-store-redis-plugin"
version = "1.0.0"
publish = false            # first-party store plugin cdylib, shipped as a packed/signed tarball, not to crates.io
edition = "2021"
rust-version = "1.97"
description = "The Redis store as a droppable busbar plugin — a cdylib exporting the store C ABI. Drop it in the plugins folder and set governance.store: redis. One Redis behind a fleet of busbar nodes means shared virtual keys, budgets, usage, and audit across the cluster."
license = "Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
# INTERIM: busbarAI isn't public yet (its plugin ABI surface lives on the 1.5.0-dev branch of the
# public GetBusbar/busbar repo until 1.5.0 ships), so these are local path dependencies into a
# sibling checkout of the monorepo. Once busbarAI/busbar ships 1.5.0 these should become git
# (pinned rev/tag) or crates.io dependencies instead — same pattern as webrequest-hook's
# busbar-plugin-sdk dependency.
busbar-api = { path = "../busbarAI/crates/api" }
busbar-plugin-sdk = { path = "../busbarAI/crates/plugin-sdk" }
# The actual KV-modeling logic crate this cdylib adapts — also a sibling path dependency (see
# above). This crate (busbar-store-redis-plugin) is intentionally a thin adapter: all Redis
# schema/serialization/retry logic lives in busbar-store-redis; here we only translate the
# engine's JSON `open` config into a `RedisStore`.
busbar-store-redis = { path = "../busbarAI/crates/store-redis" }
serde_json = "1"

[dev-dependencies]
# INTERIM local path deps, same rationale as above — dev-only (the end-to-end test loads the built
# cdylib over the real loader ABI seam, and separately connects to the live Redis independently via
# the plain busbar-store-redis lib crate), never shipped in the plugin artifact itself.
busbar-plugin-loader = { path = "../busbarAI/crates/plugin-loader" }
