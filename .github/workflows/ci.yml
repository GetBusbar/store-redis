# Calls the canonical plugin-ci reusable workflow (GetBusbar/busbar/.github/workflows/plugin-ci.yml)
# instead of hand-copying build/test/signoff steps here — see that file for what actually runs.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    uses: GetBusbar/busbar/.github/workflows/plugin-ci.yml@1.5.0-dev
    with:
      plugin_crate: busbar-store-redis-plugin
      plugin_kind: store
      plugin_alias: redis
      service: redis
      extra_sibling_test_command: >-
        cargo test -p busbar-store-redis &&
        cargo test -p busbar-store-redis -- --ignored --test-threads=1 migrate_refuses_to_wipe_non_legacy_namespace_with_missing_marker
